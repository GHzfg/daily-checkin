<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日打卡 · 短反馈面板</title>
<style>
  :root {
    --bg: #0a0c11;
    --card: #151a24;
    --card2: #1b2130;
    --line: #2a3244;
    --text: #eef2f9;
    --muted: #8a93a8;
    --green: #4ade80;
    --blue: #60a5fa;
    --yellow: #fbbf24;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 520px at 8% -12%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(820px 520px at 102% -4%, rgba(96,165,250,.10), transparent 58%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .app { max-width: 720px; margin: 0 auto; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: .5px; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 10px; letter-spacing: 2px; margin-top: 3px; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px; }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 99px;
    cursor: pointer; transition: .18s ease; font-family: inherit;
  }
  .tab.active { background: var(--card2); color: var(--text); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .hero {
    display: flex; align-items: center; gap: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .ring-wrap { position: relative; width: 118px; height: 118px; flex: 0 0 auto; }
  .ring { width: 118px; height: 118px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #202736; stroke-width: 10; }
  .ring-fg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .45s ease; }
  .ring-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: 2px; font-weight: 800;
  }
  .ring-text b { font-size: 30px; }
  .ring-text span { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .hero-copy .date { font-size: 21px; font-weight: 800; }
  .hero-copy .msg { color: var(--muted); font-size: 13px; margin-top: 7px; line-height: 1.5; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 13px; }
  @media (min-width: 700px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 85%);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .streak { font-size: 11px; color: var(--muted); background: var(--card2); border: 1px solid var(--line); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .goal {
    width: 100%; background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 8px 10px;
    font-size: 12px; font-family: inherit;
  }
  .check {
    width: 100%; padding: 11px; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card2);
    color: var(--muted); font-size: 14px; font-weight: 800; font-family: inherit;
    transition: .18s ease;
  }
  .check.done { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .meta { display: flex; align-items: center; gap: 10px; }
  .meta label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .minutes {
    width: 62px; background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 6px 8px; font-size: 12px; font-family: inherit;
  }
  .note {
    width: 100%; min-height: 58px; resize: vertical;
    background: var(--card2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; font-family: inherit;
  }
  .mini { display: flex; gap: 3px; flex-wrap: wrap; margin-left: auto; }
  .mini i { width: 8px; height: 8px; border-radius: 3px; background: #242b3a; }
  .mini i.on { background: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 12px; text-align: center;
  }
  .stat b { display: block; font-size: 22px; font-weight: 800; }
  .stat span { color: var(--muted); font-size: 11px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px; margin-bottom: 14px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-weight: 800; font-size: 15px; }
  .nav {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    background: var(--card2); border: 1px solid var(--line); color: var(--text);
    font-size: 18px; line-height: 1; font-family: inherit;
  }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 11px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border-radius: 11px; border: 1px solid transparent;
    background: var(--card2); color: var(--text); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-family: inherit; padding: 4px;
  }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.today { border-color: rgba(238,242,249,.45); }
  .cal-cell.sel { border-color: var(--green); box-shadow: 0 0 0 1px rgba(74,222,128,.35) inset; }
  .cal-cell .dots { display: flex; gap: 2px; }
  .cal-cell .dots i { width: 5px; height: 5px; border-radius: 50%; background: #2b3345; }
  .cal-cell .dots i.on { background: var(--c); }
  .detail h3 { margin: 0 0 12px; font-size: 15px; }
  .detail-row {
    display: grid; grid-template-columns: 82px 74px 1fr; gap: 8px;
    padding: 9px 0; border-top: 1px solid var(--line); align-items: start;
    font-size: 12px;
  }
  .detail-row:first-of-type { border-top: 0; }
  .detail-name { font-weight: 800; }
  .detail-state { color: var(--muted); }
  .detail-state.done { color: var(--green); }
  .detail-note { color: var(--text); line-height: 1.5; word-break: break-word; }
  .muted { color: var(--muted); }
  .rate { text-align: center; font-size: 13px; color: var(--muted); padding: 4px 0 2px; }
  .rate b { color: var(--green); font-size: 16px; }
  .toolbar { display: flex; gap: 9px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .toolbar button {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 9px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .toolbar button:hover { background: var(--card2); }
  .foot { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; line-height: 1.7; }
  @media (max-width: 480px) {
    .hero { flex-direction: column; align-items: stretch; gap: 12px; }
    .ring-wrap { align-self: center; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">每日打卡<small>SHORT FEEDBACK LOOP</small></div>
    <div class="tabs">
      <button class="tab active" data-tab="today">今天</button>
      <button class="tab" data-tab="history">历史</button>
    </div>
  </div>
  <main id="view"></main>
  <div class="toolbar">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
  <div class="foot">数据只存本机浏览器，不上传。建议每周导出一次备份。</div>
</div>
<script>
const KEY = 'daily-checkin-v1';
const TRACKS = [
  { id: 'body',   name: '身体',   icon: '🏋️', color: '#4ade80', dim: 'rgba(74,222,128,.12)' },
  { id: 'study',  name: '学习',   icon: '📚', color: '#60a5fa', dim: 'rgba(96,165,250,.12)' },
  { id: 'python', name: 'Python', icon: '🐍', color: '#fbbf24', dim: 'rgba(251,191,36,.12)' }
];
const DEFAULT_GOALS = {
  body:   '按计划训练 · 记录体重/力量/步数',
  study:  '搞懂一道题或背一页 · 写下今天学会了什么',
  python: '写 20 行代码或跑通一个小脚本'
};
const MESSAGES = {
  0: '今天还没开始。先勾掉第一件小事，反馈就来了。',
  1: '有反馈了，继续。',
  2: '只差一项，别停。',
  3: '今天收工。你又向前走了一步。'
};
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

let data = load();
let view = 'today';
let calMonth = startOfMonth(new Date());
let selectedKey = todayKey();

function load() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return { days: {}, goals: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function parseKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function trackOf(key, id) {
  const day = data.days[key];
  return (day && day[id]) || { done: false, note: '', minutes: '' };
}
function goalOf(id) { return data.goals[id] || DEFAULT_GOALS[id]; }
function doneCount(key) { return TRACKS.reduce((n, t) => n + (trackOf(key, t.id).done ? 1 : 0), 0); }
function dayRef(key) { if (!data.days[key]) data.days[key] = {}; return data.days[key]; }
function updateToday(id, patch) {
  const k = todayKey();
  const day = dayRef(k);
  if (!day[id]) day[id] = { done: false, note: '', minutes: '' };
  Object.assign(day[id], patch);
  save();
}
function toggleDone(id) {
  const k = todayKey();
  const tr = trackOf(k, id);
  updateToday(id, { done: !tr.done });
  render();
}
function setGoal(id, v) { data.goals[id] = v; save(); }
function streak(id) {
  let n = 0;
  const d = new Date();
  if (!trackOf(todayKey(), id).done) d.setDate(d.getDate() - 1);
  while (n < 4000) {
    if (trackOf(dateKey(d), id).done) { n++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function lastNDays(n) {
  const arr = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d);
    x.setDate(x.getDate() - i);
    arr.push(dateKey(x));
  }
  return arr;
}
function totalDoneDays() {
  return Object.keys(data.days).filter(k => doneCount(k) > 0).length;
}
function rate30() {
  let s = 0;
  lastNDays(30).forEach(k => s += doneCount(k));
  return Math.round(s / (30 * 3) * 100);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderToday() {
  const k = todayKey();
  const done = doneCount(k);
  const d = new Date();
  const circ = 2 * Math.PI * 52;
  const off = circ * (1 - done / 3);
  const cards = TRACKS.map(t => {
    const tr = trackOf(k, t.id);
    const st = streak(t.id);
    const mini = lastNDays(14).map(x => '<i class="' + (trackOf(x, t.id).done ? 'on' : '') + '"></i>').join('');
    return '<article class="card" style="--accent:' + t.color + ';--accent-dim:' + t.dim + '">' +
      '<div class="card-head">' +
        '<div class="card-title">' + t.icon + ' ' + t.name + '</div>' +
        '<div class="streak">🔥 连续 ' + st + ' 天</div>' +
      '</div>' +
      '<input class="goal" data-id="' + t.id + '" value="' + esc(goalOf(t.id)) + '" title="点击修改今日目标">' +
      '<button class="check ' + (tr.done ? 'done' : '') + '" data-id="' + t.id + '">' + (tr.done ? '✓ 已完成' : '标记完成') + '</button>' +
      '<div class="meta">' +
        '<label>用时 <input class="minutes" type="number" min="0" max="720" data-id="' + t.id + '" value="' + (tr.minutes || '') + '" placeholder="0"> 分</label>' +
        '<div class="mini">' + mini + '</div>' +
      '</div>' +
      '<textarea class="note" data-id="' + t.id + '" placeholder="今天做了什么？一句话就够">' + esc(tr.note || '') + '</textarea>' +
    '</article>';
  }).join('');
  return '<section class="hero">' +
    '<div class="ring-wrap">' +
      '<svg class="ring" viewBox="0 0 120 120">' +
        '<circle class="ring-bg" cx="60" cy="60" r="52"></circle>' +
        '<circle class="ring-fg" cx="60" cy="60" r="52" style="stroke:' + (done === 3 ? 'var(--green)' : 'var(--blue)') + ';stroke-dasharray:' + circ + ';stroke-dashoffset:' + off + '"></circle>' +
      '</svg>' +
      '<div class="ring-text"><b>' + done + '</b><span>/3</span></div>' +
    '</div>' +
    '<div class="hero-copy">' +
      '<div class="date">' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()] + '</div>' +
      '<div class="msg">' + MESSAGES[done] + '</div>' +
    '</div>' +
  '</section>' +
  '<section class="cards">' + cards + '</section>';
}

function renderCalendar() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const key = dateKey(new Date(y, m, d));
    const isToday = key === todayKey();
    const isSel = key === selectedKey;
    const dots = TRACKS.map(t => '<i class="' + (trackOf(key, t.id).done ? 'on' : '') + '" style="--c:' + t.color + '"></i>').join('');
    cells += '<button class="cal-cell' + (isToday ? ' today' : '') + (isSel ? ' sel' : '') + '" data-key="' + key + '">' +
      '<span>' + d + '</span><div class="dots">' + dots + '</div></button>';
  }
  return cells;
}

function renderDetail() {
  const k = selectedKey;
  const d = parseKey(k);
  const rows = TRACKS.map(t => {
    const tr = trackOf(k, t.id);
    const note = tr.note ? esc(tr.note) : '<span class="muted">没有记录</span>';
    const meta = tr.minutes ? '<div>' + tr.minutes + ' 分钟</div>' : '';
    return '<div class="detail-row">' +
      '<div class="detail-name" style="color:' + t.color + '">' + t.icon + ' ' + t.name + '</div>' +
      '<div class="detail-state ' + (tr.done ? 'done' : '') + '">' + (tr.done ? '✓ 已完成' : '— 未完成') + '</div>' +
      '<div class="detail-note">' + meta + note + '</div>' +
    '</div>';
  }).join('');
  return '<section class="panel detail">' +
    '<h3>' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()] + '</h3>' +
    rows +
  '</section>';
}

function renderHistory() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  return '<section class="stats">' +
    '<div class="stat"><b>' + totalDoneDays() + '</b><span>总打卡天数</span></div>' +
    '<div class="stat"><b>' + streak('body') + '</b><span>身体连续</span></div>' +
    '<div class="stat"><b>' + streak('study') + '</b><span>学习连续</span></div>' +
    '<div class="stat"><b>' + streak('python') + '</b><span>Python 连续</span></div>' +
  '</section>' +
  '<section class="panel">' +
    '<div class="cal-head">' +
      '<button class="nav" data-act="prev">‹</button>' +
      '<div class="cal-title">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
      '<button class="nav" data-act="next">›</button>' +
    '</div>' +
    '<div class="cal-week">' + ['一','二','三','四','五','六','日'].map(x => '<span>' + x + '</span>').join('') + '</div>' +
    '<div class="cal-grid">' + renderCalendar() + '</div>' +
  '</section>' +
  renderDetail() +
  '<div class="rate">近 30 天完成率 <b>' + rate30() + '%</b></div>';
}

function render() {
  document.getElementById('view').innerHTML = view === 'today' ? renderToday() : renderHistory();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === view));
}

const viewEl = document.getElementById('view');
const noteTimers = {};

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.tab;
  render();
}));

viewEl.addEventListener('click', e => {
  const check = e.target.closest('.check');
  if (check) { toggleDone(check.dataset.id); return; }
  const cell = e.target.closest('.cal-cell');
  if (cell && cell.dataset.key) { selectedKey = cell.dataset.key; render(); return; }
  const nav = e.target.closest('.nav');
  if (nav) {
    const y = calMonth.getFullYear();
    const m = calMonth.getMonth();
    calMonth = nav.dataset.act === 'prev' ? new Date(y, m - 1, 1) : new Date(y, m + 1, 1);
    render();
  }
});

viewEl.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('goal')) setGoal(t.dataset.id, t.value);
  if (t.classList.contains('minutes')) updateToday(t.dataset.id, { minutes: t.value === '' ? '' : Number(t.value) });
});

viewEl.addEventListener('input', e => {
  const t = e.target;
  if (!t.classList.contains('note')) return;
  const id = t.dataset.id;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(() => updateToday(id, { note: t.value }), 400);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'checkin-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o && o.days) { data = o; save(); render(); alert('导入成功'); }
      else alert('文件格式不对');
    } catch (err) { alert('导入失败：' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

render();
</script>
</body>
</html>
