<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日打卡 · 短反馈面板</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #161a22;
    --card2: #1c212c;
    --line: #2a3040;
    --text: #e7ebf3;
    --muted: #8b93a7;
    --green: #4ade80;
    --blue: #60a5fa;
    --yellow: #fbbf24;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  .date-big { font-size: 30px; font-weight: 700; letter-spacing: .5px; }
  .date-sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .progress-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-head .num { font-size: 22px; font-weight: 700; }
  .progress-msg { color: var(--muted); font-size: 14px; }
  .bar { height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), #22c55e); border-radius: 99px; transition: width .35s ease; }
  .tracks { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 760px) { .tracks { grid-template-columns: repeat(3, 1fr); } }
  .track {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .track-top { display: flex; justify-content: space-between; align-items: center; }
  .track-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .streak-badge { font-size: 12px; color: var(--muted); background: var(--card2); border: 1px solid var(--line); padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .goal {
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 10px;
    font-size: 13px;
    width: 100%;
  }
  .check-btn {
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--card2);
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s ease;
  }
  .check-btn.done { background: rgba(74,222,128,.14); border-color: var(--green); color: var(--green); }
  .row { display: flex; gap: 8px; align-items: center; }
  .minutes {
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 9px;
    width: 80px;
    font-size: 13px;
  }
  .minutes-label { color: var(--muted); font-size: 12px; }
  .note {
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 10px;
    font-size: 13px;
    width: 100%;
    resize: vertical;
    min-height: 52px;
    font-family: inherit;
  }
  .history { display: flex; gap: 4px; flex-wrap: wrap; }
  .dot { width: 12px; height: 12px; border-radius: 4px; background: var(--card2); border: 1px solid var(--line); }
  .dot.on { background: var(--green); border-color: var(--green); }
  .dot.today { outline: 1px solid var(--text); }
  .dot-label { font-size: 11px; color: var(--muted); align-self: center; margin-right: 2px; }
  .toolbar { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .toolbar button {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { background: var(--card2); }
  footer { margin-top: 26px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date-big" id="dateBig"></div>
    <div class="date-sub" id="dateSub"></div>
  </header>

  <div class="progress-card">
    <div class="progress-head">
      <span class="num" id="progressNum">0 / 3</span>
      <span class="progress-msg" id="progressMsg"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
  </div>

  <div class="tracks" id="tracks"></div>

  <div class="toolbar">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <footer>
    数据只存在本机浏览器里（localStorage），不上传任何地方。<br>
    建议每周点一次「导出备份」，把 JSON 文件留在手里，换浏览器或清缓存也不怕丢。
  </footer>
</div>

<script>
const KEY = 'daily-checkin-v1';
const TRACKS = [
  { id: 'body',   name: '身体',   icon: '🏋️', color: '#4ade80' },
  { id: 'study',  name: '学习',   icon: '📚', color: '#60a5fa' },
  { id: 'python', name: 'Python', icon: '🐍', color: '#fbbf24' }
];
const DEFAULT_GOALS = {
  body:   '按计划训练 · 记录体重/力量/步数',
  study:  '搞懂一道题或背一页 · 写下今天学会了什么',
  python: '写 20 行代码或跑通一个小脚本'
};
const MSG = {
  0: '今天还没开始。先勾掉第一件小事，反馈就来了。',
  1: '有反馈了，继续。',
  2: '只差一项，别停。',
  3: '今天收工。你已经比昨天更接近那个版本。'
};

let data = load();

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return { days: {}, goals: {} };
}
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function trackOf(key, id) {
  const day = data.days[key];
  return (day && day[id]) || { done: false, note: '', minutes: '' };
}
function goalOf(id) { return data.goals[id] || DEFAULT_GOALS[id]; }

function setTrack(id, patch) {
  const k = todayKey();
  if (!data.days[k]) data.days[k] = {};
  if (!data.days[k][id]) data.days[k][id] = { done: false, note: '', minutes: '' };
  Object.assign(data.days[k][id], patch);
  save();
  render();
}
function setGoal(id, v) { data.goals[id] = v; save(); }

function streak(id) {
  let n = 0;
  const d = new Date();
  if (!trackOf(todayKey(), id).done) d.setDate(d.getDate() - 1);
  while (n < 4000) {
    if (trackOf(dateKey(d), id).done) { n++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}

function lastNDays(n) {
  const arr = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const dd = new Date(d);
    dd.setDate(dd.getDate() - i);
    arr.push(dateKey(dd));
  }
  return arr;
}

function render() {
  const now = new Date();
  const week = ['日','一','二','三','四','五','六'];
  document.getElementById('dateBig').textContent =
    (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + week[now.getDay()];
  document.getElementById('dateSub').textContent =
    now.getFullYear() + ' 年 · 把今天变成看得到的一天';

  let doneCount = 0;
  TRACKS.forEach(t => { if (trackOf(todayKey(), t.id).done) doneCount++; });
  document.getElementById('progressNum').textContent = doneCount + ' / 3';
  document.getElementById('progressMsg').textContent = MSG[doneCount];
  document.getElementById('progressBar').style.width = (doneCount / 3 * 100) + '%';

  const tracksEl = document.getElementById('tracks');
  tracksEl.innerHTML = '';

  TRACKS.forEach(t => {
    const tr = trackOf(todayKey(), t.id);
    const st = streak(t.id);
    const card = document.createElement('div');
    card.className = 'track';
    card.style.borderTop = '3px solid ' + t.color;

    card.innerHTML =
      '<div class="track-top">' +
        '<span class="track-name">' + t.icon + ' ' + t.name + '</span>' +
        '<span class="streak-badge">🔥 连续 ' + st + ' 天</span>' +
      '</div>' +
      '<input class="goal" data-id="' + t.id + '" value="' + escapeHtml(goalOf(t.id)) + '" title="点击修改今日目标">' +
      '<button class="check-btn' + (tr.done ? ' done' : '') + '" data-id="' + t.id + '">' +
        (tr.done ? '✓ 已完成' : '标记完成') +
      '</button>' +
      '<div class="row">' +
        '<span class="minutes-label">用时(分)</span>' +
        '<input class="minutes" type="number" min="0" max="720" data-id="' + t.id + '" value="' + (tr.minutes || '') + '" placeholder="0">' +
      '</div>' +
      '<textarea class="note" data-id="' + t.id + '" placeholder="今天做了什么？一句话就够">' + escapeHtml(tr.note || '') + '</textarea>' +
      '<div class="row"><span class="dot-label">近14天</span><div class="history">' +
        lastNDays(14).map(k => {
          const on = trackOf(k, t.id).done;
          const cls = 'dot' + (on ? ' on' : '') + (k === todayKey() ? ' today' : '');
          return '<span class="' + cls + '" title="' + k + (on ? ' ✓' : '') + '"></span>';
        }).join('') +
      '</div></div>';

    tracksEl.appendChild(card);

    card.querySelector('.check-btn').addEventListener('click', () => {
      setTrack(t.id, { done: !tr.done });
    });
    card.querySelector('.goal').addEventListener('change', e => setGoal(t.id, e.target.value));
    card.querySelector('.minutes').addEventListener('change', e => {
      const v = e.target.value === '' ? '' : Number(e.target.value);
      setTrack(t.id, { minutes: v });
    });
    const note = card.querySelector('.note');
    let timer = null;
    note.addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => setTrack(t.id, { note: e.target.value }), 350);
    });
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'checkin-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (obj && obj.days) { data = obj; save(); render(); alert('导入成功'); }
      else alert('文件格式不对');
    } catch (err) { alert('导入失败：' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

render();
</script>
</body>
</html>
