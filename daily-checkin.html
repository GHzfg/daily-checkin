<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日打卡</title>
<style>
  :root {
    --paper: #f5f2ea;
    --card: #fffdf9;
    --ink: #1d1c19;
    --muted: #7d776c;
    --line: #e4ded2;
    --green: #2f6b4f;
    --blue: #3a5f8a;
    --amber: #a06a2c;
    --shadow: 0 1px 2px rgba(29,28,25,.04), 0 10px 26px rgba(29,28,25,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1000px 620px at 8% -12%, rgba(47,107,79,.07), transparent 60%),
      radial-gradient(820px 520px at 102% -6%, rgba(160,106,44,.06), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px 18px calc(30px + env(safe-area-inset-bottom));
  }
  .app { max-width: 680px; margin: 0 auto; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
  .brand { font-size: 16px; font-weight: 700; letter-spacing: .08em; }
  .brand span { display: block; margin-top: 5px; font-size: 11px; font-weight: 400; letter-spacing: .04em; color: var(--muted); }
  .tabs { display: flex; gap: 18px; padding-top: 2px; }
  .tab {
    border: 0; background: none; color: var(--muted); font-size: 13px;
    padding: 6px 0; border-bottom: 2px solid transparent; cursor: pointer;
    font-family: inherit; transition: color .15s ease;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--green); font-weight: 600; }
  .hero {
    display: flex; align-items: flex-end; gap: 26px;
    padding: 4px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  .hero-date { flex: 0 0 auto; }
  .hero-date .weekday { font-size: 11px; letter-spacing: .22em; color: var(--muted); }
  .hero-date .day {
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 68px; line-height: 1.04; font-weight: 600; letter-spacing: -.02em;
  }
  .hero-date .month { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .hero-progress { flex: 1; padding-bottom: 8px; min-width: 0; }
  .progress-text b { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .progress-text span { font-size: 12px; color: var(--muted); margin-left: 7px; }
  .progress-line { height: 3px; background: var(--line); border-radius: 99px; margin: 11px 0 12px; overflow: hidden; }
  .progress-line i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .4s ease; }
  .progress-note { font-size: 12px; color: var(--muted); line-height: 1.65; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .track {
    position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 15px 16px 14px 19px; box-shadow: var(--shadow);
  }
  .track::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .track-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .track-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .track-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .streak { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .goal {
    width: 100%; border: 0; border-bottom: 1px dashed var(--line); background: transparent;
    color: var(--ink); font-size: 12px; font-family: inherit;
    padding: 8px 0 7px; margin: 6px 0 11px;
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .check {
    padding: 8px 17px; border-radius: 99px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all .16s ease;
  }
  .check.done { background: var(--accent); border-color: var(--accent); color: #fff; }
  .time { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .minutes {
    width: 42px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--ink); font-size: 12px; text-align: center; font-family: inherit;
    padding: 2px 0;
  }
  .mini { display: flex; gap: 3px; margin-left: auto; align-items: center; }
  .mini i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .mini i.on { background: var(--accent); }
  .note {
    width: 100%; min-height: 44px; border: 0; border-top: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 12px; line-height: 1.6;
    padding: 10px 0 0; margin-top: 11px; resize: vertical; font-family: inherit;
  }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .stat { padding: 14px 6px 12px; text-align: center; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b {
    display: block; font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 25px; font-weight: 600; line-height: 1.2;
  }
  .stat span { font-size: 10px; color: var(--muted); }
  .calendar {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-title { font-size: 14px; font-weight: 600; }
  .nav {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 15px; line-height: 1;
    font-family: inherit; cursor: pointer;
  }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .cal-week span { text-align: center; font-size: 10px; color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border: 0; background: transparent; border-radius: 50%;
    color: var(--ink); font-size: 12px; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 2px;
  }
  .cal-cell.empty { cursor: default; }
  .cal-cell.today { font-weight: 700; color: var(--green); }
  .cal-cell.sel { background: rgba(47,107,79,.10); }
  .cal-cell .dots { display: flex; gap: 2px; }
  .cal-cell .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
  .cal-cell .dots i.on { background: var(--c); }
  .detail {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow);
  }
  .detail h3 { margin: 0 0 11px; font-size: 13px; font-weight: 600; }
  .detail-row {
    display: grid; grid-template-columns: 66px 58px 1fr; gap: 8px;
    padding: 10px 0; border-top: 1px solid var(--line); font-size: 12px; align-items: start;
  }
  .detail-row:first-of-type { border-top: 0; }
  .detail-name { font-weight: 600; }
  .detail-state { color: var(--muted); }
  .detail-state.done { color: var(--green); }
  .detail-note { color: var(--ink); line-height: 1.6; word-break: break-word; }
  .muted { color: var(--muted); }
  .rate { text-align: center; font-size: 12px; color: var(--muted); padding: 16px 0 2px; }
  .rate b { color: var(--green); font-size: 15px; }
  .toolbar { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  .toolbar button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 99px; padding: 8px 15px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .foot { margin-top: 15px; color: var(--muted); font-size: 10px; text-align: center; line-height: 1.7; }
  @media (max-width: 480px) {
    .hero { gap: 18px; }
    .hero-date .day { font-size: 58px; }
    .progress-text b { font-size: 25px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">每日打卡<span>把今天变成看得到的一天</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="today">今天</button>
      <button class="tab" data-tab="history">历史</button>
    </div>
  </div>
  <main id="view"></main>
  <div class="toolbar">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
  <div class="foot">数据只存本机浏览器，不上传。建议每周导出一次备份。</div>
</div>
<script>
const KEY = 'daily-checkin-v1';
const TRACKS = [
  { id: 'body',   name: '身体',   color: '#2f6b4f' },
  { id: 'study',  name: '学习',   color: '#3a5f8a' },
  { id: 'python', name: 'Python', color: '#a06a2c' }
];
const DEFAULT_GOALS = {
  body:   '按计划训练 · 记录体重/力量/步数',
  study:  '搞懂一道题或背一页 · 写下今天学会了什么',
  python: '写 20 行代码或跑通一个小脚本'
};
const MESSAGES = {
  0: '今天还没开始。先勾掉第一件小事，反馈就来了。',
  1: '有反馈了，继续。',
  2: '只差一项，别停。',
  3: '今天收工。你又向前走了一步。'
};
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

let data = load();
let view = 'today';
let calMonth = startOfMonth(new Date());
let selectedKey = todayKey();

function load() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return { days: {}, goals: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dateKey(new Date()); }
function parseKey(k) { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function trackOf(key, id) {
  const day = data.days[key];
  return (day && day[id]) || { done: false, note: '', minutes: '' };
}
function goalOf(id) { return data.goals[id] || DEFAULT_GOALS[id]; }
function doneCount(key) { return TRACKS.reduce((n, t) => n + (trackOf(key, t.id).done ? 1 : 0), 0); }
function dayRef(key) { if (!data.days[key]) data.days[key] = {}; return data.days[key]; }
function updateToday(id, patch) {
  const k = todayKey();
  const day = dayRef(k);
  if (!day[id]) day[id] = { done: false, note: '', minutes: '' };
  Object.assign(day[id], patch);
  save();
}
function toggleDone(id) {
  const k = todayKey();
  const tr = trackOf(k, id);
  updateToday(id, { done: !tr.done });
  render();
}
function setGoal(id, v) { data.goals[id] = v; save(); }
function streak(id) {
  let n = 0;
  const d = new Date();
  if (!trackOf(todayKey(), id).done) d.setDate(d.getDate() - 1);
  while (n < 4000) {
    if (trackOf(dateKey(d), id).done) { n++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function lastNDays(n) {
  const arr = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const x = new Date(d);
    x.setDate(x.getDate() - i);
    arr.push(dateKey(x));
  }
  return arr;
}
function totalDoneDays() {
  return Object.keys(data.days).filter(k => doneCount(k) > 0).length;
}
function rate30() {
  let s = 0;
  lastNDays(30).forEach(k => s += doneCount(k));
  return Math.round(s / (30 * 3) * 100);
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderToday() {
  const k = todayKey();
  const done = doneCount(k);
  const d = new Date();
  const cards = TRACKS.map(t => {
    const tr = trackOf(k, t.id);
    const st = streak(t.id);
    const mini = lastNDays(14).map(x => '<i class="' + (trackOf(x, t.id).done ? 'on' : '') + '"></i>').join('');
    return '<article class="track" style="--accent:' + t.color + '">' +
      '<div class="track-head">' +
        '<div class="track-name"><span class="dot"></span>' + t.name + '</div>' +
        '<div class="streak">连续 ' + st + ' 天</div>' +
      '</div>' +
      '<input class="goal" data-id="' + t.id + '" value="' + esc(goalOf(t.id)) + '" title="点击修改今日目标">' +
      '<div class="row">' +
        '<button class="check ' + (tr.done ? 'done' : '') + '" data-id="' + t.id + '">' + (tr.done ? '已完成' : '标记完成') + '</button>' +
        '<label class="time">用时 <input class="minutes" type="number" min="0" max="720" data-id="' + t.id + '" value="' + (tr.minutes || '') + '" placeholder="0"> 分</label>' +
        '<div class="mini">' + mini + '</div>' +
      '</div>' +
      '<textarea class="note" data-id="' + t.id + '" placeholder="今天做了什么？一句话就够">' + esc(tr.note || '') + '</textarea>' +
    '</article>';
  }).join('');
  return '<section class="hero">' +
    '<div class="hero-date">' +
      '<div class="weekday">星期' + WEEK[d.getDay()] + '</div>' +
      '<div class="day">' + d.getDate() + '</div>' +
      '<div class="month">' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月</div>' +
    '</div>' +
    '<div class="hero-progress">' +
      '<div class="progress-text"><b>' + done + '</b><span>/ 3 完成</span></div>' +
      '<div class="progress-line"><i style="width:' + (done / 3 * 100) + '%"></i></div>' +
      '<div class="progress-note">' + MESSAGES[done] + '</div>' +
    '</div>' +
  '</section>' +
  '<section class="list">' + cards + '</section>';
}

function renderCalendar() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const key = dateKey(new Date(y, m, d));
    const isToday = key === todayKey();
    const isSel = key === selectedKey;
    const dots = TRACKS.map(t => '<i class="' + (trackOf(key, t.id).done ? 'on' : '') + '" style="--c:' + t.color + '"></i>').join('');
    cells += '<button class="cal-cell' + (isToday ? ' today' : '') + (isSel ? ' sel' : '') + '" data-key="' + key + '">' +
      '<span>' + d + '</span><div class="dots">' + dots + '</div></button>';
  }
  return cells;
}

function renderDetail() {
  const k = selectedKey;
  const d = parseKey(k);
  const rows = TRACKS.map(t => {
    const tr = trackOf(k, t.id);
    const note = tr.note ? esc(tr.note) : '<span class="muted">没有记录</span>';
    const meta = tr.minutes ? '<div>' + tr.minutes + ' 分钟</div>' : '';
    return '<div class="detail-row">' +
      '<div class="detail-name" style="color:' + t.color + '">' + t.name + '</div>' +
      '<div class="detail-state ' + (tr.done ? 'done' : '') + '">' + (tr.done ? '已完成' : '未完成') + '</div>' +
      '<div class="detail-note">' + meta + note + '</div>' +
    '</div>';
  }).join('');
  return '<section class="detail">' +
    '<h3>' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + WEEK[d.getDay()] + '</h3>' +
    rows +
  '</section>';
}

function renderHistory() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  return '<section class="stats">' +
    '<div class="stat"><b>' + totalDoneDays() + '</b><span>总打卡天数</span></div>' +
    '<div class="stat"><b>' + streak('body') + '</b><span>身体连续</span></div>' +
    '<div class="stat"><b>' + streak('study') + '</b><span>学习连续</span></div>' +
    '<div class="stat"><b>' + streak('python') + '</b><span>Python 连续</span></div>' +
  '</section>' +
  '<section class="calendar">' +
    '<div class="cal-head">' +
      '<button class="nav" data-act="prev">‹</button>' +
      '<div class="cal-title">' + y + ' 年 ' + (m + 1) + ' 月</div>' +
      '<button class="nav" data-act="next">›</button>' +
    '</div>' +
    '<div class="cal-week">' + ['一','二','三','四','五','六','日'].map(x => '<span>' + x + '</span>').join('') + '</div>' +
    '<div class="cal-grid">' + renderCalendar() + '</div>' +
  '</section>' +
  renderDetail() +
  '<div class="rate">近 30 天完成率 <b>' + rate30() + '%</b></div>';
}

function render() {
  document.getElementById('view').innerHTML = view === 'today' ? renderToday() : renderHistory();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === view));
}

const viewEl = document.getElementById('view');
const noteTimers = {};

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.tab;
  render();
}));

viewEl.addEventListener('click', e => {
  const check = e.target.closest('.check');
  if (check) { toggleDone(check.dataset.id); return; }
  const cell = e.target.closest('.cal-cell');
  if (cell && cell.dataset.key) { selectedKey = cell.dataset.key; render(); return; }
  const nav = e.target.closest('.nav');
  if (nav) {
    const y = calMonth.getFullYear();
    const m = calMonth.getMonth();
    calMonth = nav.dataset.act === 'prev' ? new Date(y, m - 1, 1) : new Date(y, m + 1, 1);
    render();
  }
});

viewEl.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('goal')) setGoal(t.dataset.id, t.value);
  if (t.classList.contains('minutes')) updateToday(t.dataset.id, { minutes: t.value === '' ? '' : Number(t.value) });
});

viewEl.addEventListener('input', e => {
  const t = e.target;
  if (!t.classList.contains('note')) return;
  const id = t.dataset.id;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(() => updateToday(id, { note: t.value }), 400);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'checkin-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (o && o.days) { data = o; save(); render(); alert('导入成功'); }
      else alert('文件格式不对');
    } catch (err) { alert('导入失败：' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

render();
</script>
</body>
</html>
